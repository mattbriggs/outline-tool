[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outline-tool"
version = "0.1.0"
requires-python = ">=3.11"
description = "Offline-first minimalist outlining tool."
readme = "README.md"

# -------------------------------
# setuptools configuration
# -------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outline_tool = ["contracts/*.json"]

# -------------------------------
# tooling
# -------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "B", "UP"]
format.preview = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"